name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inventory_test
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inventory -d inventory_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Fresh database E2E
        run: pnpm test:e2e
        env:
          E2E_DATABASE_URL: postgresql://inventory:inventory_dev@localhost:5432/inventory_test
          JWT_SECRET: ci-test-secret-ci-test-secret
      - name: V1.0.0 upgrade migration
        run: pnpm test:upgrade
        env:
          UPGRADE_TEST_DATABASE_URL: postgresql://inventory:inventory_dev@localhost:5432/inventory_test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @inventory/web exec playwright install --with-deps chromium
      - run: docker compose -p inventory-ci up -d --build
      - name: Wait for application
        run: timeout 180 sh -c 'until curl -fsS http://127.0.0.1:8080/api/health; do sleep 3; done'
      - run: pnpm test:playwright
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
          INITIAL_DEMO_PASSWORD: Demo@123456
      - if: always()
        run: docker compose -p inventory-ci logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: |
            apps/web/test-results
            compose.log
          if-no-files-found: ignore

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.api -t inventory-api:ci .
      - run: docker build -f Dockerfile.web -t inventory-web:ci .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
