services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - inventory_1panel_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ghcr.io/hubo0926/inventory-management-mvp-api:${APP_VERSION:-1.2.0}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: production
      APP_VERSION: ${APP_VERSION:-1.2.0}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      INITIAL_DEMO_PASSWORD: ${INITIAL_DEMO_PASSWORD:?INITIAL_DEMO_PASSWORD is required}
      API_PORT: 3001
      UPLOAD_ROOT: ${UPLOAD_ROOT:-/app/uploads}
    volumes:
      - inventory_1panel_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    image: ghcr.io/hubo0926/inventory-management-mvp-web:${APP_VERSION:-1.2.0}
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:3001
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  inventory_1panel_postgres:
  inventory_1panel_uploads:
