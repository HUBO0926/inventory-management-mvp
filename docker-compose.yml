services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory_dev
    ports:
      - "5434:5432"
    volumes:
      - inventory_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://inventory:inventory_dev@postgres:5432/inventory
      JWT_SECRET: docker-development-secret
      JWT_EXPIRES_IN: 8h
      INITIAL_DEMO_PASSWORD: ${INITIAL_DEMO_PASSWORD:-Demo@123456}
      API_PORT: 3001
      UPLOAD_ROOT: /app/uploads
    volumes:
      - inventory_uploads:/app/uploads
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:3001
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

  gateway:
    image: caddy:2-alpine
    profiles: ["public"]
    environment:
      - PUBLIC_HOST
      - ACME_EMAIL
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  inventory_postgres:
  inventory_uploads:
  caddy_data:
  caddy_config:
